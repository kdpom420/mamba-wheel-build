name: Build mamba-ssm wheel (RHEL8 compatible)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 0. 소스 체크아웃
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. 디스크 공간 확보 (매우 중요)
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache
        df -h

    # 2. Docker 이미지 pull (RHEL8 + glibc 2.28)
    - name: Pull CUDA UBI8 image
      run: |
        docker pull nvidia/cuda:12.3.1-devel-ubi8

    # 3. mamba-ssm wheel 빌드 (CPU torch only)
    - name: Build mamba-ssm wheel
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/work \
          nvidia/cuda:12.3.1-devel-ubi8 \
          bash -c "
            set -e

            echo '== Install system deps =='
            dnf install -y \
              python39 python39-devel \
              gcc gcc-c++ make \
              git cmake \
            && dnf clean all

            echo '== Prepare pip =='
            python3.9 -m ensurepip
            python3.9 -m pip install --upgrade pip setuptools wheel

            echo '== Force remove CUDA torch / nvidia deps if any =='
            python3.9 -m pip uninstall -y \
              torch \
              nvidia-cudnn-cu12 \
              nvidia-nccl-cu12 \
              nvidia-cublas-cu12 || true

            echo '== Install CPU-only torch =='
            python3.9 -m pip install \
              torch==2.1.2+cpu \
              --index-url https://download.pytorch.org/whl/cpu \
              --no-cache-dir

            echo '== Disable build isolation (CRITICAL) =='
            export PIP_NO_BUILD_ISOLATION=1

            echo '== Clone mamba repo =='
            cd /work
            git clone https://github.com/state-spaces/mamba.git
            cd mamba

            echo '== Build wheel =='
            python3.9 -m pip wheel . \
              --no-cache-dir \
              -w /work/dist

            echo '== Done =='
            ls -lh /work/dist
          "

    # 4. 빌드 산출물 업로드
    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: mamba-ssm-wheel
        path: dist/*.whl
