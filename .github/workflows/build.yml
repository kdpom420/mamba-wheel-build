name: Build mamba-ssm Wheel

on:
  workflow_dispatch:  # 수동 실행 가능

jobs:
  build-wheel:
    runs-on: ubuntu-22.04

    env:
      MAMBA_FORCE_CPU: 1
      MAMBA_SKIP_CUDA_BUILD: 1
      PIP_NO_BUILD_ISOLATION: 1

    steps:
      # 1️⃣ Checkout repository (서브모듈 포함)
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive  # 서브모듈도 포함

      # 2️⃣ Show repo structure for debugging
      - name: Show repo structure
        run: |
          echo "=== Root directory ==="
          ls -la
          echo "=== Recursive listing ==="
          ls -R

      # 3️⃣ Setup Python 3.9
      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 4️⃣ Upgrade pip, setuptools, wheel
      - name: Upgrade pip and setuptools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # 5️⃣ Install build dependencies (numpy + CPU torch)
      - name: Install build dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch==2.1.2+cpu --index-url https://download.pytorch.org/whl/cpu

      # 6️⃣ Build mamba-ssm wheel
      - name: Build mamba-ssm wheel
        run: |
          # ✅ 안전하게 작업 공간 안에 dist 생성
          mkdir -p $GITHUB_WORKSPACE/dist

          # ✅ mamba-ssm 소스 위치 명시적 경로로 변경
          MAMBA_DIR="$GITHUB_WORKSPACE/mamba-ssm"  # 여기 경로를 명시적으로 지정

          if [ ! -d "$MAMBA_DIR" ]; then
            echo "Error: mamba-ssm directory not found at $MAMBA_DIR!"
            exit 1
          fi

          echo "mamba-ssm found at: $MAMBA_DIR"
          cd "$MAMBA_DIR"

          # ✅ Wheel 빌드
          python -m pip wheel . \
            --no-build-isolation \
            --no-cache-dir \
            -w $GITHUB_WORKSPACE/dist

      # 7️⃣ Show output wheel files
      - name: List built wheels
        run: ls -l $GITHUB_WORKSPACE/dist
