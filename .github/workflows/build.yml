name: Download mamba-ssm Prebuilt Wheels (Offline Install)

on:
  workflow_dispatch:  # 수동 실행

jobs:
  download-wheels:
    runs-on: ubuntu-22.04

    steps:
      # 1️⃣ wheels 디렉토리 생성
      - name: Create wheels directory
        run: mkdir -p $GITHUB_WORKSPACE/wheels

      # 2️⃣ 실제 존재하는 prebuilt wheel 다운로드 (Python 3.9 cp39 호환)
      - name: Download mamba-ssm and causal-conv1d wheels
        run: |
          # mamba_ssm: cp39, cu11, torch2.4, cxx11abiTRUE (A100 호환 최고)
          wget -O $GITHUB_WORKSPACE/wheels/mamba_ssm-2.2.6.post3-cp39.whl \
            https://github.com/state-spaces/mamba/releases/download/v2.2.6.post3/mamba_ssm-2.2.6.post3+cu11torch2.4cxx11abiTRUE-cp39-cp39-linux_x86_64.whl
          
          # causal-conv1d: cp39, cu11, torch2.4 (의존성, optional but 추천)
          wget -O $GITHUB_WORKSPACE/wheels/causal_conv1d-1.5.4-cp39.whl \
            https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.5.4/causal_conv1d-1.5.4+cu11torch2.4cxx11abiTRUE-cp39-cp39-linux_x86_64.whl
          
          # 다운로드 성공 확인
          echo "=== Downloaded wheels ==="
          ls -lh $GITHUB_WORKSPACE/wheels
          sha256sum $GITHUB_WORKSPACE/wheels/*.whl  # checksum 확인용

      # 3️⃣ Artifact 업로드
      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: mamba-ssm-offline-wheels-cp39
          path: $GITHUB_WORKSPACE/wheels/*.whl
          if-no-files-found: error
