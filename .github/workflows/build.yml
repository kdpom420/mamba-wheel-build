name: Download mamba-ssm Prebuilt Wheel

on:
  workflow_dispatch:  # 수동 실행

jobs:
  download-wheel:
    runs-on: ubuntu-22.04

    steps:
      # 1️⃣ 작업 디렉토리 설정
      - name: Set up workspace
        run: |
          mkdir -p $GITHUB_WORKSPACE/wheels

      # 2️⃣ Python 설정 (임시 env 위해)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 3️⃣ mamba-ssm 설치 (prebuilt wheel 자동 다운로드)
      - name: Install mamba-ssm (downloads prebuilt wheel)
        run: |
          python -m pip install --no-deps --target $GITHUB_WORKSPACE/wheels mamba-ssm
          python -m pip install --no-deps --target $GITHUB_WORKSPACE/wheels causal-conv1d  # 의존성

      # 4️⃣ 다운로드된 wheel 확인 및 복사
      - name: Find and copy wheels
        run: |
          echo "=== Downloaded wheels in pip cache ==="
          ls -la ~/.cache/pip/wheels/*.whl || echo "No wheels in cache"
          
          # pip cache에서 wheel 복사 (prebuilt가 cache에 저장됨)
          cp ~/.cache/pip/wheels/mamba_ssm*.whl $GITHUB_WORKSPACE/wheels/ || echo "mamba_ssm wheel not found"
          cp ~/.cache/pip/wheels/causal_conv1d*.whl $GITHUB_WORKSPACE/wheels/ || echo "causal_conv1d wheel not found"
          
          echo "=== Final wheels directory ==="
          ls -la $GITHUB_WORKSPACE/wheels

      # 5️⃣ Artifact 업로드 (다운로드 가능)
      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: mamba-ssm-wheels
          path: $GITHUB_WORKSPACE/wheels/*.whl
          if-no-files-found: error
