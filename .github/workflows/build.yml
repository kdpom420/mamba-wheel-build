name: Build mamba-ssm CPU Wheel (Mamba-2 포함)

on:
  workflow_dispatch:  # 수동 실행

jobs:
  build-wheel:
    runs-on: ubuntu-22.04

    env:
      MAMBA_FORCE_BUILD: 1       # prebuilt 무시하고 소스 빌드 강제
      MAMBA_SKIP_CUDA_BUILD: 1   # CPU-only 빌드 → GLIBC 문제 거의 없음
      PIP_NO_BUILD_ISOLATION: 1

    steps:
      # 1️⃣ 공식 state-spaces/mamba 리포지토리 체크아웃
      - name: Checkout state-spaces/mamba
        uses: actions/checkout@v4
        with:
          repository: state-spaces/mamba
          ref: main
          submodules: recursive

      # 2️⃣ 디버깅: 루트 구조 + mamba_ssm 폴더 확인
      - name: Show repo structure
        run: |
          echo "=== Root directory ==="
          ls -la
          echo "=== Check mamba_ssm folder ==="
          ls -la mamba_ssm || echo "mamba_ssm not found!"

      # 3️⃣ Python 3.9 설정
      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 4️⃣ pip 업그레이드
      - name: Upgrade pip and tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # 5️⃣ 빌드 의존성 (CPU-only torch)
      - name: Install build dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch==2.1.2+cpu torchvision==0.16.2+cpu torchaudio==2.1.2+cpu --index-url https://download.pytorch.org/whl/cpu

      # 6️⃣ wheel 빌드 (루트에서! cd 필요 없음)
      - name: Build mamba-ssm wheel
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist

          # pyproject.toml 확인 (빌드 파일 존재 여부)
          if [ ! -f "pyproject.toml" ]; then
            echo "Error: pyproject.toml not found!"
            ls -la
            exit 1
          fi

          echo "Building from root (pyproject.toml found)..."
          python -m pip wheel . \
            --no-build-isolation \
            --no-cache-dir \
            --wheel-dir $GITHUB_WORKSPACE/dist

      # 7️⃣ 빌드된 wheel 확인
      - name: List built wheels
        run: |
          echo "=== Built wheels ==="
          ls -la $GITHUB_WORKSPACE/dist

      # 8️⃣ Artifact 업로드
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: mamba-ssm-cpu-wheel
          path: $GITHUB_WORKSPACE/dist/*.whl
          if-no-files-found: error
