name: build-mamba-ssm-wheel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pull RHEL8 CUDA image
        run: |
          docker pull nvidia/cuda:12.3.2-devel-ubi8

      - name: Build wheel in UBI8 container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            nvidia/cuda:12.3.1-devel-ubi8 \
            bash -c "
              dnf install -y python39 python39-devel git \
                             gcc gcc-c++ make cmake &&
              python3.9 -m ensurepip &&
              python3.9 -m pip install --upgrade pip setuptools wheel

              # torch CPU 버전
              python3.9 -m pip install \
                torch==2.1.2+cpu \
                --index-url https://download.pytorch.org/whl/cpu
              
              # mamba 빌드
              git clone https://github.com/state-spaces/mamba.git
              cd mamba
              python3.9 -m pip wheel . -w /work/dist
            "


      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: mamba-ssm-wheel
          path: dist/*.whl

