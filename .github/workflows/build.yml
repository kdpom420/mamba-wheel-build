name: Download Mamba-2 Minimal Pure PyTorch (Offline Install)

on:
  workflow_dispatch:  # 수동 실행

jobs:
  download-mamba2-minimal:
    runs-on: ubuntu-22.04

    steps:
      - name: Create directory
        run: mkdir -p $GITHUB_WORKSPACE/mamba2_minimal

      - name: Download and unzip mamba2-minimal repo
        run: |
          wget -O $GITHUB_WORKSPACE/mamba2_minimal/mamba2-minimal.zip \
            https://github.com/tommyip/mamba2-minimal/archive/refs/heads/main.zip
          
          unzip $GITHUB_WORKSPACE/mamba2_minimal/mamba2-minimal.zip -d $GITHUB_WORKSPACE/mamba2_minimal
          
          echo "=== Extracted files ==="
          ls -la $GITHUB_WORKSPACE/mamba2_minimal/mamba2-minimal-main

      # 핵심 수정: 디렉토리 전체를 업로드 (재귀적으로 모든 파일 포함)
      - name: Upload entire repo as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mamba2-minimal-offline
          path: $GITHUB_WORKSPACE/mamba2_minimal/mamba2-minimal-main/**
          if-no-files-found: error
