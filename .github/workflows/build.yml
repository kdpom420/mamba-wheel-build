name: Build mamba-ssm Wheel

on:
  workflow_dispatch:  # 수동 실행 시 트리거

jobs:
  build-wheel:
    runs-on: ubuntu-22.04

    env:
      MAMBA_FORCE_CPU: 1
      MAMBA_SKIP_CUDA_BUILD: 1
      PIP_NO_BUILD_ISOLATION: 1

    steps:
      # 1️⃣ Checkout repository (서브모듈 포함)
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive  # 서브모듈도 함께 체크아웃

      # 2️⃣ Show repo structure for debugging
      - name: Show repo structure
        run: |
          ls -R  # 레포 구조 확인

      # 3️⃣ Setup Python 3.9
      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 4️⃣ Upgrade pip & setuptools
      - name: Upgrade pip and setuptools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # 5️⃣ Install build dependencies (numpy + CPU torch)
      - name: Install build dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch==2.1.2+cpu --index-url https://download.pytorch.org/whl/cpu

      # 6️⃣ Build mamba-ssm wheel
      - name: Build mamba-ssm wheel
        run: |
          mkdir -p ./dist
          # 현재 `mamba-ssm`이 어디에 있는지 확인 후, 그 경로로 이동
          cd $(find . -type d -name "mamba-ssm" -print -quit)   # mamba-ssm 디렉토리로 이동
          python -m pip wheel . \
            --no-build-isolation \
            --no-cache-dir \
            -w ../dist

      # 7️⃣ Show output wheel files
      - name: List built wheels
        run: ls -l ./dist
