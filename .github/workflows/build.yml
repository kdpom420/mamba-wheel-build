name: Build mamba-ssm Wheel

on:
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-22.04

    env:
      # CPU 빌드를 강제, CUDA 탐지 방지
      MAMBA_FORCE_CPU: 1
      MAMBA_SKIP_CUDA_BUILD: 1
      PIP_NO_BUILD_ISOLATION: 1

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Python 3.9
      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. Upgrade pip & setuptools
      - name: Upgrade pip and setuptools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # 4. Install build dependencies (CPU torch + numpy)
      - name: Install build dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch==2.1.2+cpu --index-url https://download.pytorch.org/whl/cpu

      # 5. Build mamba-ssm wheel
      - name: Build mamba-ssm wheel
        run: |
          mkdir -p ./dist
          cd mamba
          python -m pip wheel . \
            --no-build-isolation \
            --no-cache-dir \
            -w ../dist

      # 6. Show output wheel files
      - name: List built wheels
        run: ls -l /work/dist
